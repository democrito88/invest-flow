services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invest-app
    restart: unless-stopped
    ports: 
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/investments?schema=public
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - invest-flow
  postgres:
    image: postgres:17
    container_name: invest-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invest-flow

networks:
  invest-flow:

volumes:
  postgres_data: